<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Gift Customize | Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f6f4ef;
  color:#171717;
}

header{
  background:#171717;
  color:#fff;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

header h1{
  margin:0;
  font-size:21px;
}

header small{
  display:block;
  color:#c9a45b;
  margin-top:4px;
}

button{
  border:0;
  cursor:pointer;
  border-radius:9px;
  padding:11px 16px;
  font-weight:700;
}

.logout{
  background:#fff;
  color:#111;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.login-box{
  max-width:420px;
  margin:70px auto;
  background:#fff;
  padding:28px;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.login-box h2{
  margin-top:0;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:9px;
  margin:7px 0 15px;
  font-size:15px;
}

.login-btn{
  width:100%;
  background:#171717;
  color:#fff;
}

.message{
  margin-top:12px;
  color:#b00020;
}

.dashboard{
  display:none;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:14px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.stat span{
  display:block;
  color:#777;
  font-size:13px;
}

.stat b{
  display:block;
  font-size:25px;
  margin-top:7px;
}

.toolbar{
  background:#fff;
  padding:15px;
  border-radius:14px;
  margin-bottom:15px;
}

.orders{
  display:grid;
  gap:15px;
}

.order{
  background:#fff;
  border-radius:16px;
  padding:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.order-id{
  font-weight:800;
  font-size:18px;
}

.order-info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px 20px;
  margin-top:15px;
  font-size:14px;
}

.order-info div{
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.label{
  color:#777;
  display:block;
  font-size:12px;
  margin-bottom:3px;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#eee;
  font-size:12px;
  font-weight:700;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.actions button{
  background:#171717;
  color:#fff;
}

.refresh{
  background:#c9a45b;
  color:#111;
}

.empty{
  background:#fff;
  padding:30px;
  text-align:center;
  border-radius:15px;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .order-info{
    grid-template-columns:1fr;
  }

  .actions{
    grid-template-columns:1fr;
  }

  header{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <h1>Gift Customize Admin</h1>
    <small>Order Management Panel</small>
  </div>

  <button
    class="logout"
    id="logoutBtn"
    onclick="logout()"
    style="display:none"
  >
    Logout
  </button>
</header>


<!-- ================= LOGIN ================= -->

<section id="loginSection" class="login-box">

  <h2>Admin Login</h2>

  <p>
    Login with your Supabase admin account.
  </p>

  <label>Email</label>

  <input
    id="email"
    type="email"
    placeholder="Admin email"
    autocomplete="username"
  >

  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="Admin password"
    autocomplete="current-password"
  >

  <button
    class="login-btn"
    onclick="login()"
  >
    Login
  </button>

  <div
    id="loginMessage"
    class="message"
  ></div>

</section>


<!-- ================= DASHBOARD ================= -->

<section id="dashboard" class="dashboard">

<div class="container">

  <div class="stats">

    <div class="stat">
      <span>Total Orders</span>
      <b id="totalOrders">0</b>
    </div>

    <div class="stat">
      <span>Pending Payment</span>
      <b id="pendingPayments">0</b>
    </div>

    <div class="stat">
      <span>Payment Submitted</span>
      <b id="submittedPayments">0</b>
    </div>

    <div class="stat">
      <span>Confirmed Orders</span>
      <b id="confirmedOrders">0</b>
    </div>

  </div>


  <div class="toolbar">


<button
  class="refresh"
  onclick="loadOrders()"
>
  Refresh
</button>
    

    <select
      id="statusFilter"
      onchange="loadOrders()"
      style="margin-top:12px"
    >
      <option value="">All Orders</option>
      <option value="Pending">Pending</option>
      <option value="Confirmed">Confirmed</option>
      <option value="Shipped">Shipped</option>
      <option value="Delivered">Delivered</option>
      <option value="Cancelled">Cancelled</option>
    </select>

  </div>


  <div
    id="orders"
    class="orders"
  ></div>

</div>

</section>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://tfsqaccacdundsmdyetc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_f9TuYFxn5Vye5OBPjvrw3Q_6hFzByFd";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  const message =
    document.getElementById(
      "loginMessage"
    );

  message.textContent = "";


  if(!email || !password){

    message.textContent =
      "Please enter email and password.";

    return;
  }


  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  if(error){

    console.error(error);

    message.textContent =
      error.message;

    return;
  }


  showDashboard();
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById(
    "dashboard"
  ).style.display = "none";

  document.getElementById(
    "loginSection"
  ).style.display = "block";

  document.getElementById(
    "logoutBtn"
  ).style.display = "none";
}


/* =========================
   SHOW DASHBOARD
========================= */

async function showDashboard(){

  document.getElementById(
    "loginSection"
  ).style.display = "none";

  document.getElementById(
    "dashboard"
  ).style.display = "block";

  document.getElementById(
    "logoutBtn"
  ).style.display = "block";

  await loadOrders();
}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  const ordersBox =
    document.getElementById(
      "orders"
    );

  ordersBox.innerHTML =
    `<div class="empty">
      Loading orders...
    </div>`;


  const filter =
    document.getElementById(
      "statusFilter"
    ).value;


  let query =
    supabaseClient
      .from("orders")
      .select("*")
      .order("id", {
        ascending:false
      });


  if(filter){

    query =
      query.eq(
        "order_status",
        filter
      );
  }


  const { data, error } =
    await query;


  if(error){

    console.error(error);

    ordersBox.innerHTML =
      `<div class="empty">
        Unable to load orders.<br><br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  updateStats(data || []);

  renderOrders(data || []);
}


/* =========================
   STATS
========================= */

function updateStats(orders){

  document.getElementById(
    "totalOrders"
  ).textContent =
    orders.length;


  document.getElementById(
    "pendingPayments"
  ).textContent =
    orders.filter(
      x =>
        x.payment_status === "Pending"
    ).length;


  document.getElementById(
    "submittedPayments"
  ).textContent =
    orders.filter(
      x =>
        x.payment_status === "Submitted"
    ).length;


  document.getElementById(
    "confirmedOrders"
  ).textContent =
    orders.filter(
      x =>
        x.order_status === "Confirmed"
    ).length;
}


/* =========================
   RENDER ORDERS
========================= */

function renderOrders(orders){

  const box =
    document.getElementById(
      "orders"
    );


  if(!orders.length){

    box.innerHTML =
      `<div class="empty">
        No orders found.
      </div>`;

    return;
  }


  box.innerHTML =
    orders.map(order => `

      <article class="order">

        <div class="order-top">

          <div>

            <div class="order-id">
              ${escapeHtml(
                order.order_id || "N/A"
              )}
            </div>

            <small>
              ${order.created_at
                ? new Date(
                    order.created_at
                  ).toLocaleString("en-IN")
                : ""
              }
            </small>

          </div>


          <div>

            <span class="badge">
              Payment:
              ${escapeHtml(
                order.payment_status ||
                "Pending"
              )}
            </span>

            <span class="badge">
              Order:
              ${escapeHtml(
                order.order_status ||
                "Pending"
              )}
            </span>

          </div>

        </div>


        <div class="order-info">

          <div>
            <span class="label">
              Customer
            </span>
            ${escapeHtml(
              order.customer_name || ""
            )}
          </div>


          <div>
            <span class="label">
              Mobile
            </span>
            ${escapeHtml(
              order.mobile || ""
            )}
          </div>


          <div>
            <span class="label">
              Address
            </span>
            ${escapeHtml(
              [
                order.address,
                order.city,
                order.state,
                order.pincode
              ]
              .filter(Boolean)
              .join(", ")
            )}
          </div>


          <div>
            <span class="label">
              Total
            </span>
            ₹${Number(
              order.total_amount || 0
            ).toFixed(2)}
          </div>


          <div>
            <span class="label">
              UTR / Transaction ID
            </span>

            ${
              order.payment_utr
              ? escapeHtml(
                  order.payment_utr
                )
              : "Not submitted"
            }

          </div>


          <div>
            <span class="label">
              Items
            </span>

            ${formatItems(
              order.items
            )}

          </div>

        </div>


        <div class="actions">

          <button
            onclick="updatePayment(
              '${escapeJs(
                order.order_id
              )}',
              'Verified'
            )"
          >
            ✓ Verify Payment
          </button>


          <button
            onclick="updatePayment(
              '${escapeJs(
                order.order_id
              )}',
              'Rejected'
            )"
          >
            ✕ Reject Payment
          </button>


          <select
            onchange="updateOrderStatus(
              '${escapeJs(
                order.order_id
              )}',
              this.value
            )"
          >

            <option value="">
              Change Order Status
            </option>

            <option value="Pending"
              ${order.order_status === "Pending"
                ? "selected" : ""}>
              Pending
            </option>

            <option value="Confirmed"
              ${order.order_status === "Confirmed"
                ? "selected" : ""}>
              Confirmed
            </option>

            <option value="Shipped"
              ${order.order_status === "Shipped"
                ? "selected" : ""}>
              Shipped
            </option>

            <option value="Delivered"
              ${order.order_status === "Delivered"
                ? "selected" : ""}>
              Delivered
            </option>

            <option value="Cancelled"
              ${order.order_status === "Cancelled"
                ? "selected" : ""}>
              Cancelled
            </option>

          </select>
<button
  onclick="contactCustomerWhatsApp(
    '${escapeJs(order.mobile)}',
    '${escapeJs(order.order_id)}',
    '${escapeJs(order.customer_name)}',
    '${escapeJs(order.total_amount)}',
    '${escapeJs(order.payment_status)}',
    '${escapeJs(order.order_status)}'
  )"
>
  📱 WhatsApp Customer
</button>

          <button
            class="refresh"
            onclick="loadOrders()"
          >
            Refresh
          </button>

        </div>

      </article>

    `).join("");
}


/* =========================
   PAYMENT STATUS
========================= */

async function updatePayment(
  orderId,
  status
){

  if(!confirm(
    "Change payment status to " +
    status + "?"
  )) return;


  const { error } =
    await supabaseClient
      .from("orders")
      .update({
        payment_status: status
      })
      .eq(
        "order_id",
        orderId
      );


  if(error){

    alert(
      "Could not update payment:\n" +
      error.message
    );

    return;
  }


  alert(
    "Payment status updated."
  );

  loadOrders();
}


/* =========================
   ORDER STATUS
========================= */

async function updateOrderStatus(
  orderId,
  status
){

  if(!status) return;


  const { error } =
    await supabaseClient
      .from("orders")
      .update({
        order_status: status
      })
      .eq(
        "order_id",
        orderId
      );


  if(error){

    alert(
      "Could not update order:\n" +
      error.message
    );

    return;
  }


  loadOrders();
}


/* =========================
   ITEMS
========================= */

function formatItems(items){

  if(!items) return "—";


  if(typeof items === "string"){

    try{
      items = JSON.parse(items);
    }catch{
      return escapeHtml(items);
    }
  }


  if(!Array.isArray(items))
    return "—";


  return items.map(item => {

    if(typeof item === "string")
      return escapeHtml(item);


    return escapeHtml(
      item.name || "Item"
    );

  }).join("<br>");
}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function escapeJs(value){

  return String(value ?? "")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}

/* =========================
   WHATSAPP CUSTOMER
========================= */

function contactCustomerWhatsApp(
  mobile,
  orderId,
  customerName,
  totalAmount,
  paymentStatus,
  orderStatus
){

  let phone =
    String(mobile || "")
      .replace(/\D/g, "");


  if(!phone){

    alert(
      "Customer mobile number not found."
    );

    return;
  }


  /*
    India number:
    10 digit number -> 91 + number
  */

  if(phone.length === 10){

    phone = "91" + phone;

  } else if(
    phone.length === 12 &&
    phone.startsWith("91")
  ){

    // Already has country code

  } else {

    alert(
      "Invalid customer mobile number."
    );

    return;
  }


  const amount =
    "₹" +
    Number(
      totalAmount || 0
    ).toFixed(2);


  const message =
`Hello ${customerName || "Customer"},

Thank you for choosing Gift Customize. 🎁

Your order details:

Order ID: ${orderId || "N/A"}

Order Amount: ${amount}

Payment Status: ${paymentStatus || "Pending"}

Order Status: ${orderStatus || "Pending"}

We will keep you updated about your order.

Thank you,
Gift Customize`;


  const url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(message);


  window.open(
    url,
    "_blank"
  );
}
/* =========================
   CHECK EXISTING SESSION
========================= */

(async function(){

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if(session){

    showDashboard();

  }

})();
</script>

</body>
    </html>
